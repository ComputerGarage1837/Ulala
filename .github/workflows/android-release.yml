name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (must already exist)'
        required: true
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Firebase and signing configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG"
          test -n "$SIGNING_KEY"
          printf '%s' "$FIREBASE_CONFIG" | base64 --decode > android/app/google-services.json
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/staff-release.jks"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE }}
          VERSION_NAME: ${{ inputs.tag || github.ref_name }}
          KEYSTORE_PATH: ${{ runner.temp }}/staff-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$VERSION_CODE"
          gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Generate update manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk release/loon-hearth-staff.apk
          python3 scripts/update_manifest.py release/loon-hearth-staff.apk release/update.json
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/loon-hearth-staff.apk release/update.json --title "Loon & Hearth Staff $RELEASE_TAG" --generate-notes
      - name: Remove secrets
        if: always()
        run: rm -f android/app/google-services.json "$RUNNER_TEMP/staff-release.jks"
