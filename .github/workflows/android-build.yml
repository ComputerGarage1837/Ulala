name: Android test build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure optional Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > android/app/google-services.json
          fi
      - name: Build Android app
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: loon-hearth-staff-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Remove Firebase configuration
        if: always()
        run: rm -f android/app/google-services.json
